<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="../assets/icon.png" type="image/png" />
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../assets/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="N.S Company" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="N.S-Company Full Stack package" />
    <meta name="keywords" content="NEYDRA, Imagination, Reality, Web Development, Exchange tnd, Trading" />
    <meta name="theme-color" content="#000000" />
    <meta name="theme-color" content="#000000">
    <meta property="og:description" content="N.S-Company" />
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta property="og:image" content="https://raw.githubusercontent.com/ilyesjarray/Neydra-assets/main/og-image3.jpg" />
    <meta property="og:image:secure_url" content="https://raw.githubusercontent.com/ilyesjarray/Neydra-assets/main/og-image3.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://n.s.c.vercel.app" />
    <title>N.S-Company</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Initial Interaction Overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #start-text {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            animation: pulseText 2s infinite;
        }

        /* Main Content Container */
        #main-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0; 
            pointer-events: none; 
            background-color: #000;
        }

        /* 1. Base Lobby Image */
        #lobby-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: idlePulse 4s ease-in-out infinite alternate;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        /* Proximity Glow Layers */
        .glow-layer {
            position: absolute;
            top: 0;
            width: 45%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            z-index: 2; /* Above bg, below gif/click zones */
            mix-blend-mode: screen; /* High-end lighting blend */
            transition: opacity 0.15s ease-out; /* Smooth tracking */
        }

        #glow-left {
            left: 0;
            /* Cyan gradient */
            background: radial-gradient(circle at 0% 50%, rgba(0, 213, 255, 0.6) 0%, rgba(0, 213, 255, 0) 70%);
        }

        #glow-right {
            right: 0;
            /* Red gradient */
            background: radial-gradient(circle at 100% 50%, rgba(255, 0, 0, 0.6) 0%, rgba(255, 0, 0, 0) 70%);
        }

        /* 2. GIF Overlay Layer */
        #lobby-gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; 
            z-index: 3; 
            pointer-events: none; 
        }

        /* 3. NEW: Purchase Screen Overlay */
        #purchase-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: 20; /* High z-index to cover everything and capture clicks */
            pointer-events: none; /* Initially unclickable */
            animation: idlePulse 4s ease-in-out infinite alternate;
            transition: opacity 1s ease;
            cursor: pointer;
        }

        /* Click Zones */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            z-index: 10;
            cursor: pointer;
        }

        #zone-left { left: 0; width: 30%; }
        #zone-center { left: 30%; width: 40%; }
        #zone-right { right: 0; width: 30%; }

        /* Animations */
        @keyframes pulseText {
            0% { opacity: 0.3; }
            50% { opacity: 1; text-shadow: 0 0 10px rgb(255, 255, 255); }
            100% { opacity: 0.3; }
        }

        @keyframes idlePulse {
            0% { 
                filter: brightness(0.85) contrast(1.1) drop-shadow(0 0 0px rgba(255, 0, 0, 0)); 
                transform: scale(1);
            }
            100% { 
                filter: brightness(1.15) contrast(1.2) drop-shadow(0 0 25px rgba(255, 0, 0, 0.4)); 
                transform: scale(1.02);
            }
        }

        /* Utility Classes */
        .fade-in {
            transition: opacity 3s ease-in;
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        .animation-paused {
            animation: none !important;
            transform: scale(1) !important;
            filter: brightness(1) !important;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            font-family: 'Courier New', Courier, monospace;
        }

        .loading-container {
            width: 60%;
            max-width: 600px;
        }

        .loading-text {
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #00d5ff; /* Cyan accent */
            display: flex;
            justify-content: space-between;
        }

        .loading-bar-wrapper {
            width: 100%;
            height: 4px;
            background-color: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d5ff, #fff);
            box-shadow: 0 0 10px rgba(0, 213, 255, 0.8);
            transition: width 0.1s linear;
        }
        
        .loading-glitch {
            animation: glitchText 4s infinite;
        }

        @keyframes glitchText {
            0%, 95%, 100% { opacity: 1; text-shadow: none; transform: translate(0); }
            96% { opacity: 0.8; text-shadow: 2px 0 red, -2px 0 cyan; transform: translate(-2px, 1px); }
            97% { opacity: 0.9; text-shadow: -2px 0 red, 2px 0 cyan; transform: translate(2px, -1px); }
            98% { opacity: 1; text-shadow: none; transform: translate(0); }
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div id="start-text">System Standby - Tap to Initialize</div>
    </div>

    <div id="loading-overlay">
        <div class="loading-container">
            <div class="loading-text loading-glitch">
                <span id="loading-status">INITIALIZING SYSTEMS...</span>
                <span id="loading-percent">0%</span>
            </div>
            <div class="loading-bar-wrapper">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
        </div>
    </div>

    <div id="main-container">
        <img src="../assets/lobby.png" id="lobby-bg" alt="Lobby Environment">
        <div id="glow-left" class="glow-layer"></div>
        <div id="glow-right" class="glow-layer"></div>
        
        <img src="" id="lobby-gif" alt="Lobby Action"> 
        <img src="../assets/purchase.png" id="purchase-bg" alt="Purchase Required">
        
        <div id="zone-left" class="click-zone"></div>
        <div id="zone-center" class="click-zone"></div>
        <div id="zone-right" class="click-zone"></div>
    </div>

    <audio id="theme-music" src="../assets/thememusic.mp3" loop></audio>
    <audio id="click-sound" src="../assets/clicksound.wav"></audio>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const mainContainer = document.getElementById('main-container');
        const lobbyBg = document.getElementById('lobby-bg');
        const lobbyGif = document.getElementById('lobby-gif'); 
        const purchaseBg = document.getElementById('purchase-bg'); // New element
        
        const glowLeft = document.getElementById('glow-left');
        const glowRight = document.getElementById('glow-right');

        const themeMusic = document.getElementById('theme-music');
        const clickSound = document.getElementById('click-sound');

        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingBar = document.getElementById('loading-bar');
        const loadingPercent = document.getElementById('loading-percent');
        const loadingStatus = document.getElementById('loading-status');
        
        const zoneLeft = document.getElementById('zone-left');
        const zoneCenter = document.getElementById('zone-center');
        const zoneRight = document.getElementById('zone-right');

        // Orientation and Fullscreen Locks
        async function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } 
                catch (err) { console.log("Landscape lock bypass/unsupported:", err); }
            }
        }

        function requestFullScreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
        }

        // Initialization
        startOverlay.addEventListener('click', () => {
            requestFullScreen();
            lockLandscape();
            themeMusic.volume = 1.0;
            themeMusic.play();

            startOverlay.style.display = 'none';

            // Show loading screen immediately
            loadingOverlay.style.opacity = '1';
            loadingOverlay.style.pointerEvents = 'auto';

            // Preload 47MB GIF via XHR to capture download progress
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '../assets/lobby.gif', true);
            xhr.responseType = 'blob';

            xhr.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    loadingBar.style.width = percentComplete + '%';
                    loadingPercent.textContent = Math.floor(percentComplete) + '%';
                    
                    if (percentComplete < 30) {
                        loadingStatus.textContent = 'ESTABLISHING SECURE CONNECTION...';
                    } else if (percentComplete < 60) {
                        loadingStatus.textContent = 'DOWNLOADING CORE ASSETS...';
                    } else if (percentComplete < 90) {
                        loadingStatus.textContent = 'DECRYPTING RESOURCES...';
                    } else {
                        loadingStatus.textContent = 'FINALIZING DEPLOYMENT...';
                    }
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200 || xhr.status === 0) { // status 0 is for cached/local responses sometimes
                    loadingBar.style.width = '100%';
                    loadingPercent.textContent = '100%';
                    loadingStatus.textContent = 'SYSTEM READY.';

                    // Preload smaller background asset seamlessly
                    fetch('../assets/purchase.png').catch(() => {});

                    setTimeout(() => proceedToMain(), 800); // Dramatic pause
                } else {
                    proceedToMain();
                }
            };

            xhr.onerror = () => { proceedToMain(); };
            xhr.send();

            function proceedToMain() {
                loadingOverlay.style.opacity = '0';
                loadingOverlay.style.pointerEvents = 'none';
                setTimeout(() => {
                    mainContainer.classList.add('fade-in');
                }, 500); // Wait for loading screen to fade out
            }
        });

        // ==========================================
        // PROXIMITY GLOW LOGIC (Mouse Tracking)
        // ==========================================
        document.addEventListener('mousemove', (e) => {
            const width = window.innerWidth;
            const mouseX = e.clientX;
            
            // Effect activates when mouse is within 40% of either screen edge
            const triggerDistance = width * 0.4; 

            if (mouseX < triggerDistance) {
                // Mouse is on the left (Sovereign - Cyan)
                const intensity = 1 - (mouseX / triggerDistance);
                glowLeft.style.opacity = intensity;
                glowRight.style.opacity = 0;
            } 
            else if (mouseX > width - triggerDistance) {
                // Mouse is on the right (Neydra - Red)
                const intensity = 1 - ((width - mouseX) / triggerDistance);
                glowRight.style.opacity = intensity;
                glowLeft.style.opacity = 0;
            } 
            else {
                // Mouse is dead center
                glowLeft.style.opacity = 0;
                glowRight.style.opacity = 0;
            }
        });


        // ==========================================
        // NAVIGATION LOGIC
        // ==========================================
        function handleNavigation(url) {
            clickSound.currentTime = 0;
            clickSound.play();
            setTimeout(() => { window.location.href = url; }, 300);
        }

        zoneLeft.addEventListener('click', () => handleNavigation('https://thesovereign.vercel.app'));
        zoneRight.addEventListener('click', () => handleNavigation('https://neydra.vercel.app'));

        // ==========================================
        // CENTER CLICK & PURCHASE SCREEN LOGIC
        // ==========================================
        let isGifPlaying = false;
        let isPurchaseScreenActive = false;
        
        const gifDurationMs = 3000; // MUST MATCH EXACT GIF LENGTH

        zoneCenter.addEventListener('click', () => {
            if (isGifPlaying || isPurchaseScreenActive) return; 
            
            isGifPlaying = true;
            clickSound.currentTime = 0;
            clickSound.play();

            // Pause the PNG breathing animation
            lobbyBg.classList.add('animation-paused');

            // 1. Play GIF
            lobbyGif.style.transition = 'none';
            lobbyGif.style.opacity = 1;
            lobbyGif.src = '../assets/lobby.gif?t=' + new Date().getTime();

            // 2. Wait for GIF to finish, then show Purchase screen
            setTimeout(() => {
                purchaseBg.style.opacity = 1;
                purchaseBg.style.pointerEvents = 'auto'; // Make it clickable
                isPurchaseScreenActive = true;
                isGifPlaying = false; 
            }, gifDurationMs);
        });

        // 3. User clicks ANYWHERE on the purchase screen to dismiss it
        purchaseBg.addEventListener('click', () => {
            if (!isPurchaseScreenActive) return;
            
            clickSound.currentTime = 0;
            clickSound.play();
            
            // Fade out both the purchase overlay and the underlying GIF layer
            purchaseBg.style.opacity = 0;
            purchaseBg.style.pointerEvents = 'none'; 
            
            lobbyGif.style.transition = 'opacity 1s ease';
            lobbyGif.style.opacity = 0;
            
            // 4. Wait for fade to finish, then un-pause the original background
            setTimeout(() => {
                lobbyBg.classList.remove('animation-paused'); // Resume PNG idle animation
                isPurchaseScreenActive = false;
            }, 1000); // Wait 1s for the CSS transition to finish
        });

        // Register Service Worker for PWA installability
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js', { scope: '../' })
                .then((reg) => console.log('SW registered:', reg.scope))
                .catch((err) => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
