<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gateway Terminal</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none; /* Prevent text selection */
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d; /* Deep charcoal background */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Initial Interaction Overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #start-text {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.7;
            animation: pulseText 2s infinite;
        }

        /* Main Content Container */
        #main-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0; 
            pointer-events: none; 
            background-color: #000;
        }

        /* The Background Image with Fixed Animations */
        #lobby-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Default PNG idle animation */
            animation: idlePulse 4s ease-in-out infinite alternate;
            transition: opacity 0.3s ease;
        }

        /* Click Zones */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            z-index: 10;
            cursor: pointer;
        }

        /* Divided into 3 sections now: Left, Center, Right */
        #zone-left {
            left: 0;
            width: 30%;
        }

        #zone-center {
            left: 30%;
            width: 40%;
        }

        #zone-right {
            right: 0;
            width: 30%;
        }

        /* Animations */
        @keyframes pulseText {
            0% { opacity: 0.3; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
            100% { opacity: 0.3; }
        }

        /* Custom fixed animation for the PNG */
        @keyframes idlePulse {
            0% { 
                filter: brightness(0.85) contrast(1.1) drop-shadow(0 0 0px rgba(255, 0, 0, 0)); 
                transform: scale(1);
            }
            100% { 
                /* Glowing brightness and subtle aggressive red shadow */
                filter: brightness(1.15) contrast(1.2) drop-shadow(0 0 25px rgba(255, 0, 0, 0.4)); 
                transform: scale(1.02); /* Very slight zoom breathing effect */
            }
        }

        /* Utility Classes */
        .fade-in {
            transition: opacity 3s ease-in;
            opacity: 1 !important;
            pointer-events: auto !important;
        }
        
        .animation-paused {
            animation: none !important;
            transform: scale(1) !important;
            filter: brightness(1) !important;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div id="start-text">System Standby - Tap to Initialize</div>
    </div>

    <div id="main-container">
        <img src="assets/lobby.png" id="lobby-bg" alt="Lobby Environment">
        
        <div id="zone-left" class="click-zone"></div>
        <div id="zone-center" class="click-zone"></div>
        <div id="zone-right" class="click-zone"></div>
    </div>

    <audio id="theme-music" src="assets/thememusic.mp3" loop></audio>
    <audio id="click-sound" src="assets/clicksound.wav"></audio>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const mainContainer = document.getElementById('main-container');
        const lobbyBg = document.getElementById('lobby-bg');
        const themeMusic = document.getElementById('theme-music');
        const clickSound = document.getElementById('click-sound');
        
        const zoneLeft = document.getElementById('zone-left');
        const zoneCenter = document.getElementById('zone-center');
        const zoneRight = document.getElementById('zone-right');

        // Orientation and Fullscreen Locks
        async function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                try { await screen.orientation.lock('landscape'); } 
                catch (err) { console.log("Landscape lock bypass/unsupported:", err); }
            }
        }

        function requestFullScreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
        }

        // Initialization
        startOverlay.addEventListener('click', () => {
            requestFullScreen();
            lockLandscape();
            themeMusic.volume = 0.5;
            themeMusic.play();

            startOverlay.style.display = 'none';

            setTimeout(() => {
                mainContainer.classList.add('fade-in');
            }, 1000); 
        });

        // Navigation Logic
        function handleNavigation(url) {
            clickSound.currentTime = 0;
            clickSound.play();
            setTimeout(() => { window.location.href = url; }, 300);
        }

        // Left (-x) -> The Sovereign
        zoneLeft.addEventListener('click', () => handleNavigation('https://thesovereign.vercel.app'));

        // Right (+x) -> Neydra
        zoneRight.addEventListener('click', () => handleNavigation('https://neydra.vercel.app'));

        // Center Click Logic for GIF playback
        let isGifPlaying = false;
        
        // IMPORTANT: Set this to match the exact duration of your GIF in milliseconds
        const gifDurationMs = 2000; 

        zoneCenter.addEventListener('click', () => {
            // Prevent multiple triggers while the animation is already running
            if (isGifPlaying) return; 
            isGifPlaying = true;

            // Optional: play click sound for center interaction too
            clickSound.currentTime = 0;
            clickSound.play();

            // Pause the PNG breathing animation so the GIF plays normally
            lobbyBg.classList.add('animation-paused');

            // 1. Play forward GIF
            lobbyBg.src = 'assets/lobby.gif';

            // 2. Wait for forward GIF to finish, then play reverse GIF
            setTimeout(() => {
                lobbyBg.src = 'assets/lobby_reverse.gif';
                
                // 3. Wait for reverse GIF to finish, return to PNG
                setTimeout(() => {
                    lobbyBg.src = 'assets/lobby.png';
                    lobbyBg.classList.remove('animation-paused'); // Resume PNG idle animation
                    isGifPlaying = false; // Unlock center zone
                }, gifDurationMs);

            }, gifDurationMs);
        });
    </script>
</body>
</html>
